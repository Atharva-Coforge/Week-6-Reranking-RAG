[project]
name = "week-6-reranking-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "chromadb",
    "cohere",
    "einops",
    "httpx",
    "mypy>=2.3.1",
    "pymupdf",
    "pytest>=9.1.1",
    "rank-bm25",
    "ruff>=0.16.8",
    "sentence-transformers",
]

[tool.ruff]
target-version = "py312"
extend-exclude = ["data"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["(?x)(^data/)"]

[tool.pytest.ini_options]
testpaths = ["tests"]
