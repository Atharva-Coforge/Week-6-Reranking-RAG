name: checks

on:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      - name: Install dependencies from the lockfile
        run: uv sync --frozen

      - name: ruff
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy src/

      - name: ingest
        run: uv run python -m src.main ingest

      - name: two-sentence check
        run: uv run python -m src.two_sentence_check

      - name: pytest
        run: uv run pytest

  live-evaluation:
    name: Live Evaluation Harness
    runs-on: self-hosted
    needs: checks
    env:
      OLLAMA_URL: http://127.0.0.1:11434
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      - name: Install dependencies from the lockfile
        run: uv sync --frozen

      - name: Check local Ollama
        run: curl -fsS "$OLLAMA_URL/api/tags"

      - name: Require Cohere key
        run: test -n "$COHERE_API_KEY"

      - name: ingest
        run: uv run python -m src.main ingest

      - name: pytest
        run: uv run pytest -v
